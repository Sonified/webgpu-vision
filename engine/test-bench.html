<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Model Benchmark</title></head>
<body style="background:#111;color:#0f0;font:13px monospace;padding:16px;white-space:pre-wrap;">
<div id="log"></div>
<script type="module">
import { ModelRunner } from './model-runner.js';

const L = document.getElementById('log');
const log = s => { L.textContent += s + '\n'; console.log(s); };

const MODELS = {
  'standard-f32': { json: '../models/hand/hand_landmark_standard/hand_landmark_standard',        f16: false },
  'standard-f16': { json: '../models/hand/hand_landmark_standard/hand_landmark_standard_f16',    f16: true  },
  'large-f32':    { json: '../models/hand/hand_landmark_large/hand_landmark_large',              f16: false },
  'large-f16':    { json: '../models/hand/hand_landmark_large/hand_landmark_large_f16',          f16: true  },
};

const params = new URLSearchParams(location.search);
const which = params.get('m') || 'standard-f32';
const model = MODELS[which];

if (!model) {
  log('Unknown model: ' + which);
  log('Options: ' + Object.keys(MODELS).join(', '));
  log('Usage: test-bench.html?m=standard-f16');
} else {

(async () => {
try {
  log(`Benchmark: ${which} (${model.f16 ? 'f16' : 'f32'})`);
  log('========================================\n');

  if (!navigator.gpu) { log('No WebGPU'); return; }
  const adapter = await navigator.gpu.requestAdapter();
  const needsF16 = model.f16;
  if (needsF16 && !adapter.features.has('shader-f16')) { log('ERROR: shader-f16 not supported'); return; }
  const device = await adapter.requestDevice(needsF16 ? { requiredFeatures: ['shader-f16'] } : {});

  // Compile pipelines
  const mk = async (name) => {
    const suffix = needsF16 ? '_f16' : '';
    const file = name + suffix;
    try {
      const code = await (await fetch(`./${file}.wgsl`)).text();
      return device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code }), entryPoint: 'main' } });
    } catch(e) {
      // Fall back to f32 version for shaders without f16 variant
      const code = await (await fetch(`./${name}.wgsl`)).text();
      return device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code }), entryPoint: 'main' } });
    }
  };
  const P = {
    conv2d: await mk('conv2d'), gemm: await mk('gemm'), global_avg_pool: await mk('global_avg_pool'),
    add: await mk('add'), fused_block: await mk('fused_block'), maxpool: await mk('maxpool'),
  };
  // These don't have f16 variants, always use f32
  const mkF32 = async (name) => {
    const code = await (await fetch(`./${name}.wgsl`)).text();
    return device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code }), entryPoint: 'main' } });
  };
  P.transpose_nhwc = await mkF32('transpose_nhwc');
  P.pad_channels = await mkF32('pad_channels');
  log('Shaders compiled');

  // Load model
  const graphJson = await (await fetch(model.json + '.json')).json();
  const binRaw = await (await fetch(model.json + '.bin')).arrayBuffer();
  const TA = model.f16 ? Float16Array : Float32Array;
  const weights = new TA(binRaw);
  log(`Model loaded: ${(binRaw.byteLength/1024/1024).toFixed(1)} MB, ${graphJson.graph.length} nodes`);

  // Upload weights
  const align4 = (arr) => {
    if (arr.byteLength % 4 === 0) return arr;
    const padded = new TA(arr.length + 1);
    padded.set(arr);
    return padded;
  };
  const bpe = model.f16 ? 2 : 4;
  const W = {};
  for (const [name, info] of Object.entries(graphJson.weights)) {
    if (info.length === 0) continue;
    const data = align4(weights.subarray(info.offset, info.offset + info.length));
    const buf = device.createBuffer({ size: Math.max(data.byteLength, 4), usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, data);
    W[name] = buf;
  }
  const allW = align4(weights);
  const allWBuf = device.createBuffer({ size: allW.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(allWBuf, 0, allW);

  // Input
  const H = 224, Wi = 224;
  const BF = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST;
  const inputData = new TA(3 * H * Wi).fill(0.5);
  const inputBuf = device.createBuffer({ size: inputData.byteLength, usage: BF });
  device.queue.writeBuffer(inputBuf, 0, inputData);

  const runner = new ModelRunner(device, P, W, allWBuf, model.f16 ? { f16: true } : {});

  // Correctness
  const outputs = await runner.run(graphJson, inputBuf, weights);
  log('\nOutputs:');
  for (const [name, data] of Object.entries(outputs)) {
    const vals = Array.from(data.slice(0, 5)).map(v => Number(v).toFixed(4)).join(', ');
    log(`  ${name} (${data.length}): [${vals}...]`);
  }

  // Benchmark: compile + warmup + 5 batches of 50
  await runner.compile(graphJson, inputBuf, weights);
  for (let i = 0; i < 30; i++) await runner.runCompiled();

  log('\nBenchmark (5 x 50 iterations):');
  const N = 50;
  const batches = [];
  for (let b = 0; b < 5; b++) {
    const t0 = performance.now();
    for (let i = 0; i < N; i++) await runner.runCompiled();
    const ms = (performance.now() - t0) / N;
    batches.push(ms);
    log(`  batch ${b+1}: ${ms.toFixed(2)} ms`);
  }
  batches.sort((a, b) => a - b);
  const median = batches[2];

  log(`\n========================================`);
  log(`${which}: ${median.toFixed(2)} ms (median)`);
  log(`Download: ${(binRaw.byteLength/1024/1024).toFixed(1)} MB`);
  log(`========================================`);
  log('done');
} catch (e) {
  log('ERROR: ' + e.message);
  log(e.stack || '');
}
})();
}
</script>
</body>
</html>
