<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hand Landmark Sparse (10MB) Test</title></head>
<body style="background:#111;color:#0f0;font:13px monospace;padding:16px;white-space:pre-wrap;">
<div id="log">Hand Landmark Sparse (10MB) Test
=================================
</div>
<script type="module">
import { ModelRunner } from './model-runner.js';

const L = document.getElementById('log');
const log = s => { L.textContent += s + '\n'; console.log(s); };

(async () => {
try {
  log(`Started: ${new Date().toISOString()}`);
  if (!navigator.gpu) { log('No WebGPU'); return; }
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  log('WebGPU ready');

  // Load sparse model
  const graph = await (await fetch('../models/hand/hand_landmark_10mb/hand_landmark_sparse.json')).json();
  const allWeights = new Float32Array(await (await fetch('../models/hand/hand_landmark_10mb/hand_landmark_sparse.bin')).arrayBuffer());
  log(`Model: ${graph.graph.length} nodes, ${(allWeights.length*4/1024/1024).toFixed(2)} MB`);
  log(`Input: ${JSON.stringify(graph.input)}`);
  log(`Outputs: ${graph.outputs.map(o => o.name + ' ' + JSON.stringify(o.shape)).join(', ')}`);
  log(`Ops: ${[...new Set(graph.graph.map(n => n.op))].sort().join(', ')}`);

  // Upload weights
  const W = {};
  for (const [name, info] of Object.entries(graph.weights)) {
    if (info.length === 0) continue;
    const buf = device.createBuffer({ size: Math.max(info.length * 4, 4), usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, allWeights.subarray(info.offset, info.offset + info.length));
    W[name] = buf;
  }

  // Compile shaders
  const mkPipeline = async (name) => {
    const code = await (await fetch(`./${name}.wgsl`)).text();
    return device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code }), entryPoint: 'main' } });
  };
  const P = {
    conv2d: await mkPipeline('conv2d'),
    maxpool: await mkPipeline('maxpool'),
    resize: await mkPipeline('resize'),
    gemm: await mkPipeline('gemm'),
    global_avg_pool: await mkPipeline('global_avg_pool'),
    add: await mkPipeline('add'),
    fused_block: await mkPipeline('fused_block'),
    transpose_nhwc: await mkPipeline('transpose_nhwc'),
  };
  log('Shaders compiled');

  const allWeightsBuf = device.createBuffer({ size: allWeights.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(allWeightsBuf, 0, allWeights);

  // Prepare input: NCHW (1, 3, 224, 224), 0.5 gray
  const H = 224, Wi = 224;
  const inputNCHW = new Float32Array(3 * H * Wi).fill(0.5);
  const inputBuf = device.createBuffer({
    size: inputNCHW.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(inputBuf, 0, inputNCHW);

  const runner = new ModelRunner(device, P, W, allWeightsBuf);

  // Run once for correctness
  log('\nRunning inference...');
  const t0 = performance.now();
  const outputs = await runner.run(graph, inputBuf, allWeights);
  const t1 = performance.now();
  log(`Inference time: ${(t1 - t0).toFixed(1)}ms`);

  // Show outputs
  log('\n--- Results ---');
  for (const [name, data] of Object.entries(outputs)) {
    const vals = Array.from(data.slice(0, 8)).map(v => v.toFixed(4)).join(', ');
    log(`${name} (${data.length}): [${vals}${data.length > 8 ? ', ...' : ''}]`);
  }

  // Benchmark: compiled -- 5 batches of 50
  log('\n--- Benchmark (5 x 50 iterations, compiled) ---');
  await runner.compile(graph, inputBuf, allWeights);
  for (let i = 0; i < 20; i++) await runner.runCompiled();
  const N = 50;
  const batches = [];
  for (let b = 0; b < 5; b++) {
    const bt0 = performance.now();
    for (let i = 0; i < N; i++) await runner.runCompiled();
    const ms = (performance.now() - bt0) / N;
    batches.push(ms);
    log(`  BATCH ${b+1}: ${ms.toFixed(2)} ms/inference`);
  }
  batches.sort((a, b) => a - b);
  const perFrame = batches[2];
  log(`WGSL MEDIAN: ${perFrame.toFixed(2)} ms/inference`);

  // Compare with 4MB model
  log('\n--- 4MB model comparison ---');
  try {
    const graph4 = await (await fetch('../models/hand/hand_landmark_4mb/hand_landmark_full.json')).json();
    const weights4 = new Float32Array(await (await fetch('../models/hand/hand_landmark_4mb/hand_landmark_full.bin')).arrayBuffer());
    const W4 = {};
    for (const [name, info] of Object.entries(graph4.weights)) {
      if (info.length === 0) continue;
      const buf = device.createBuffer({ size: Math.max(info.length * 4, 4), usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
      device.queue.writeBuffer(buf, 0, weights4.subarray(info.offset, info.offset + info.length));
      W4[name] = buf;
    }
    const allWeightsBuf4 = device.createBuffer({ size: weights4.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(allWeightsBuf4, 0, weights4);
    const runner4 = new ModelRunner(device, P, W4, allWeightsBuf4);
    await runner4.compile(graph4, inputBuf, weights4);
    for (let i = 0; i < 20; i++) await runner4.runCompiled();
    const batches4 = [];
    for (let b = 0; b < 5; b++) {
      const bt0 = performance.now();
      for (let i = 0; i < N; i++) await runner4.runCompiled();
      const ms = (performance.now() - bt0) / N;
      batches4.push(ms);
    }
    batches4.sort((a, b) => a - b);
    const perFrame4 = batches4[2];
    log(`4MB WGSL MEDIAN: ${perFrame4.toFixed(2)} ms/inference`);
    log(`10MB WGSL MEDIAN: ${perFrame.toFixed(2)} ms/inference`);
    log(`Ratio: ${(perFrame / perFrame4).toFixed(2)}x`);
  } catch(e) { log(`4MB comparison error: ${e.message}`); }

  log('\n=================================');
  log('done');
} catch (e) {
  log('ERROR: ' + e.message);
  log(e.stack || '');
}
})();
</script>
</body>
</html>
