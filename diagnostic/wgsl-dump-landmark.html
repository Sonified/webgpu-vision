<!DOCTYPE html>
<html>
<head><title>WGSL vs ORT Landmark Layer Diff</title></head>
<body>
<pre id="log">Loading...</pre>
<canvas id="preview" width="224" height="224" style="border:1px solid #333; display:none"></canvas>
<script type="module">
import { ModelRunner } from '../engine/model-runner.js';

const SIZE = 224;
const el = document.getElementById('log');
const addLog = (msg) => { el.textContent += '\n' + msg; console.log(msg); };

function compare(wgsl, ort) {
  if (wgsl.length !== ort.length) {
    return { match: false, reason: `size mismatch: wgsl=${wgsl.length} ort=${ort.length}` };
  }
  let maxAbs = 0, sumSq = 0, maxIdx = 0;
  for (let i = 0; i < wgsl.length; i++) {
    const d = Math.abs(wgsl[i] - ort[i]);
    sumSq += d * d;
    if (d > maxAbs) { maxAbs = d; maxIdx = i; }
  }
  const rmse = Math.sqrt(sumSq / wgsl.length);
  return { match: maxAbs < 0.05, maxAbs, rmse, maxIdx, wgslAt: wgsl[maxIdx], ortAt: ort[maxIdx] };
}

async function run() {
  const params = new URLSearchParams(location.search);
  const imageStem = params.get('image') || 'hand_000';
  const dumpDir = `dumps/landmark_${imageStem}`;
  addLog(`=== WGSL vs ORT Landmark Layer Diff: ${imageStem} ===`);

  // Load ORT manifest
  let manifest;
  try {
    manifest = await (await fetch(`${dumpDir}/_manifest.json`)).json();
  } catch (e) {
    addLog(`ERROR: could not load ${dumpDir}/_manifest.json`);
    addLog(`Run: python3 diagnostic/ort_dump_landmark.py images/test_images/hand_images/${imageStem}.png`);
    return;
  }
  addLog(`ORT manifest: ${manifest.layers.length} layers`);

  // Build ORT lookup: node index -> layer info
  const ortByIdx = {};
  for (const l of manifest.layers) ortByIdx[l.idx] = l;

  // Load the EXACT NCHW input that Python ORT used
  const nchw = new Float32Array(await (await fetch(`${dumpDir}/_input_nchw.bin`)).arrayBuffer());
  addLog(`Loaded NCHW input: ${nchw.length} floats (expected ${3 * SIZE * SIZE})`);

  // Init WebGPU
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { addLog('ERROR: no WebGPU adapter'); return; }
  const device = await adapter.requestDevice();
  addLog('WebGPU ready');

  // Load model
  const graph = await (await fetch('../models/hand/hand_landmark_large/hand_landmark_large.json')).json();
  const allWeights = new Float32Array(await (await fetch('../models/hand/hand_landmark_large/hand_landmark_large.bin')).arrayBuffer());
  addLog(`Model loaded: ${graph.graph.length} ops, ${Object.keys(graph.weights).length} weights`);

  // Create weight buffers
  const W = {};
  for (const [name, info] of Object.entries(graph.weights)) {
    if (info.length === 0) continue;
    const data = allWeights.subarray(info.offset, info.offset + info.length);
    const padded = data.byteLength % 4 === 0 ? data : (() => { const p = new Float32Array(data.length + 1); p.set(data); return p; })();
    const buf = device.createBuffer({ size: Math.max(padded.byteLength, 4), usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, padded);
    W[name] = buf;
  }
  const allWeightsBuf = device.createBuffer({ size: allWeights.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(allWeightsBuf, 0, allWeights);

  // Input buffer
  const BF = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST;
  const inputBuf = device.createBuffer({ size: nchw.byteLength, usage: BF });
  device.queue.writeBuffer(inputBuf, 0, nchw);

  // Pipelines
  const mkP = async (name) => {
    const code = await (await fetch(`../engine/${name}.wgsl`)).text();
    return device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code }), entryPoint: 'main' } });
  };
  const P = {
    conv2d: await mkP('conv2d'), maxpool: await mkP('maxpool'), resize: await mkP('resize'),
    gemm: await mkP('gemm'), global_avg_pool: await mkP('global_avg_pool'),
    add: await mkP('add'), pad_channels: await mkP('pad_channels'),
    fused_block: await mkP('fused_block'), transpose_nhwc: await mkP('transpose_nhwc'),
  };

  // Run WGSL engine with dumpAll
  const runner = new ModelRunner(device, P, W, allWeightsBuf);
  addLog('Running WGSL inference (dumpAll)...');
  const wgslTensors = await runner.run(graph, inputBuf, allWeights, false, true);
  const wgslKeys = Object.keys(wgslTensors).map(Number).sort((a,b) => a-b);
  addLog(`WGSL dumped ${wgslKeys.length} tensors`);

  // Layer-by-layer comparison
  addLog('\n--- LAYER-BY-LAYER COMPARISON ---');
  let firstBad = null;
  for (const idx of wgslKeys) {
    const wt = wgslTensors[idx];
    const ol = ortByIdx[idx];
    if (!ol) {
      addLog(`  [${idx}] ${wt.op}: WGSL-only (fused? no ORT ref)`);
      continue;
    }

    // Load ORT reference
    const ortData = new Float32Array(await (await fetch(`${dumpDir}/${ol.bin}`)).arrayBuffer());
    const cmp = compare(wt.data, ortData);

    const tag = cmp.match ? 'OK' : 'DIVERGE';
    const shapeStr = JSON.stringify(wt.shape);
    const line = `  [${String(idx).padStart(3)}] ${wt.op.padEnd(18)} ${shapeStr.padEnd(22)} ${tag} maxAbs=${cmp.maxAbs?.toFixed(6) || '?'} rmse=${cmp.rmse?.toFixed(6) || '?'}`;

    if (!cmp.match) {
      addLog(line + `  @${cmp.maxIdx} wgsl=${cmp.wgslAt?.toFixed(4)} ort=${cmp.ortAt?.toFixed(4)}`);
      if (!firstBad) {
        firstBad = idx;
        addLog(`    >>> FIRST DIVERGENCE at node ${idx} (${wt.op}) <<<`);
        addLog(`    wgsl first8: [${Array.from(wt.data.slice(0,8)).map(v=>v.toFixed(4))}]`);
        addLog(`    ort  first8: [${Array.from(ortData.slice(0,8)).map(v=>v.toFixed(4))}]`);
        const wMin = Math.min(...Array.from(wt.data.slice(0,1000)));
        const wMax = Math.max(...Array.from(wt.data.slice(0,1000)));
        addLog(`    wgsl range: [${wMin.toFixed(4)}, ${wMax.toFixed(4)}]`);
        addLog(`    ort  range: [${ol.min.toFixed(4)}, ${ol.max.toFixed(4)}]`);
      }
    } else {
      addLog(line);
    }
  }

  // Show final outputs
  addLog('\n--- FINAL OUTPUTS ---');
  const outputs = {};
  for (const outDef of graph.outputs) {
    const name = outDef.name;
    let floats = 1;
    for (const d of outDef.shape) floats *= d;
    // Find the tensor that produced this output
    for (const idx of wgslKeys) {
      const wt = wgslTensors[idx];
      if (wt.name === name || (wt.data && wt.data.length === floats)) {
        outputs[name] = wt.data;
        break;
      }
    }
  }

  for (const outDef of graph.outputs) {
    const name = outDef.name;
    const ol = manifest.layers.find(l => l.name === name);
    if (outputs[name] && ol) {
      const ortData = new Float32Array(await (await fetch(`${dumpDir}/${ol.bin}`)).arrayBuffer());
      const cmp = compare(outputs[name], ortData);
      addLog(`  ${name}: ${cmp.match ? 'MATCH' : 'DIVERGE'} maxAbs=${cmp.maxAbs?.toFixed(6)} wgsl=[${Array.from(outputs[name]).map(v=>v.toFixed(4))}] ort=[${Array.from(ortData).map(v=>v.toFixed(4))}]`);
    } else {
      addLog(`  ${name}: NOT FOUND in WGSL dump`);
    }
  }

  if (firstBad === null) {
    addLog('\nALL LAYERS MATCH');
  } else {
    addLog(`\nFIRST DIVERGENCE: node ${firstBad} (${wgslTensors[firstBad].op})`);
  }

  addLog('\ndone');
  window.__diffDone = true;
}

run().catch(e => { addLog('ERROR: ' + e.message + '\n' + e.stack); console.error(e); window.__diffDone = 'error'; });
</script>
</body>
</html>
